<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KERO | Creative Zone</title>
    
    <style>
        @font-face {
            font-family: 'Ethnocentric';
            src: url('ethnocentric.ttf') format('truetype');
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #050b11;
            font-family: 'Ethnocentric', sans-serif;
            overflow-x: hidden;
            color: white;
        }

        /* --- Animations --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-up { animation: fadeInUp 1s ease forwards; }

        /* --- Hero Section --- */
        .hero-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 5%;
        }

        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('Ultra_wide_futuristic_cyberpunk_workspace_202605072305 1.jpg') center/cover;
            z-index: 1;
        }

        .main-header { position: fixed; top: 20px; left: 3%; transform: translateX(-50%); z-index: 100; width: 90%; text-align: center; }
        .navbar-img { max-height: 80px; }

        .title-container { position: relative; z-index: 7; width: 40%; }
        .title-img { width: 100%; }

        .character-layer { position: absolute; bottom: 0; right: 5%; width: 40%; z-index: 5; }
        .character-img { width: 100%; }

        /* --- Stats Section --- */
        .stats-section {
            background-color: #000;
            padding: 80px 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            border-top: 2px solid #00f3ff;
            box-shadow: 0 -5px 20px rgba(0, 243, 255, 0.2);
        }

        .stat-number { font-size: 3.5rem; color: #fff; margin-bottom: 10px; text-shadow: 0 0 10px #00f3ff; }
        .stat-label { font-size: 1.2rem; color: #00f3ff; text-transform: uppercase; letter-spacing: 2px; }

        /* --- Responsive Design --- */
        @media (max-width: 992px) {
            .hero-container { justify-content: center; text-align: center; }
            .title-container { width: 80%; margin-top: -20vh; }
            .character-layer { width: 60%; right: 20%; }
        }

        @media (max-width: 600px) {
            .character-layer { width: 90%; right: 5%; opacity: 0.7; }
            .stat-number { font-size: 2.5rem; }
            .stat-label { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header class="main-header animate-up">
        <img src="Group 33.png" class="navbar-img">
    </header>

    <main class="hero-container">
        <div class="bg-layer"></div>
        <div class="title-container animate-up">
            <img src="Group 2.png" class="title-img">
        </div>
        <div class="character-layer animate-up">
            <img src="Group 57.png" class="character-img">
        </div>
    </main>

   <section class="stats-section">
        <div class="stat-box">
            <div class="stat-number" data-target="2">0</div>
            <div class="stat-label">Years</div>
        </div>
        <div class="stat-box">
            <div class="stat-number" data-target="5">0</div>
            <div class="stat-label">Design Fields</div>
        </div>
        <div class="stat-box">
            <div class="stat-number" data-target="30">0</div>
            <div class="stat-label">Projects</div>
        </div>
    </section>

    <script>
        const counters = document.querySelectorAll('.stat-number');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    counters.forEach(counter => {
                        const target = +counter.getAttribute('data-target');
                        let count = 0;
                        const increment = target / 50; 
                        const update = () => {
                            count += increment;
                            if(count < target) {
                                counter.innerText = Math.ceil(count);
                                setTimeout(update, 30);
                            } else {
                                counter.innerText = target + "+";
                            }
                        };
                        update();
                    });
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.5 });
        
        observer.observe(document.querySelector('.stats-section'));
    </script>
</body>
</html>
